
<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>华夏游 | China Travel</title>
    
    <!-- 1. 预连接核心域名 -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://esm.sh" crossorigin />
    <link rel="dns-prefetch" href="https://api.open-meteo.com" />
    <link rel="dns-prefetch" href="https://picsum.photos" />

    <!-- 2. 关键路径内联样式：防止白屏 -->
    <style>
      body { margin: 0; background-color: #0f172a; font-family: sans-serif; }
      #root:empty { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      #root:empty::before { 
        content: ''; width: 64px; height: 64px; 
        background: #14b8a6; border-radius: 18px; 
        box-shadow: 0 10px 25px -5px rgba(20, 184, 166, 0.4);
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      #root:empty::after {
        content: 'CHINA TRAVEL'; margin-top: 20px; 
        color: #5eead4; font-size: 10px; font-weight: 900; 
        letter-spacing: 0.3em; opacity: 0.5;
      }
      @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .7; transform: scale(0.95); } }
    </style>

    <!-- 3. 异步加载非关键 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/noto-sans-sc@latest/css/noto-sans-sc.css" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/animate.css@4.1.1/animate.min.css" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" media="print" onload="this.media='all'">
